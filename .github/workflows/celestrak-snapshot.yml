name: CelesTrak GP-group snapshots

# CelesTrak asks clients not to download a GP group more often than every
# two hours. This job is scheduled at that interval and the script enforces
# the 2-hour minimum interval independently for each configured group
# (stations, active, cosmos-1408-debris, cosmos-2251-debris,
# fengyun-1c-debris, iridium-33-debris) via <group>.meta.json.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download configured CelesTrak GP groups sequentially
        run: python scripts/fetch_celestrak_snapshot.py

      - name: Commit GP-group snapshots when changed
        run: |
          git add data/gp/
          git diff --cached --quiet -- data/gp && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh CelesTrak GP-group snapshots (not a live feed)"
          git push
